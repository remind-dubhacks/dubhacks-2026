[project]
name = "remind-robot-worker"
version = "0.1.0"
description = "ReMind SO-101 robot worker (mock or Perceptron policy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only needed on the machine wired to the SO-101: `uv sync --extra hardware`
hardware = ["lerobot[feetech,hardware,dataset,core-scripts,viz]>=0.6", "numpy", "pillow"]
