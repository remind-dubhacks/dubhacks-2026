<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The main game loop</title><desc id="d">The robot arm mixes up three keychains, the resident puts them back, a camera checks the table, ReMind answers kindly, and a short note goes to the caregiver. If it is not right, the resident tries again, up to three times.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B645B"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9730D"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D4AFF"/></marker>
</defs>
<rect width="1000" height="560" fill="#FBF9F5"/>
<text x="30" y="52" font-size="30" font-weight="700" fill="#2B2723">The main game: put things back in order</text><text x="30" y="82" font-size="18" fill="#6B645B">The robot arm mixes up three keychains. The resident fixes them. ReMind responds and tells the caregiver.</text><rect x="25" y="130" width="170" height="255" rx="18" fill="#fff" stroke="#8C857B" stroke-width="2" stroke-dasharray="8 6"/><circle cx="51" cy="156" r="16" fill="#D9730D"/><text x="51" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="110" y="300" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">The robot arm mixes</text><text x="110" y="324" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">up three keychains</text><rect x="220" y="130" width="170" height="255" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="246" cy="156" r="16" fill="#D9730D"/><text x="246" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="305" y="300" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">You put them back</text><text x="305" y="324" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">in the right order,</text><text x="305" y="348" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">by hand</text><rect x="415" y="130" width="170" height="255" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="441" cy="156" r="16" fill="#D9730D"/><text x="441" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="500" y="300" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">A camera checks</text><text x="500" y="324" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">the table</text><rect x="610" y="130" width="170" height="255" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="636" cy="156" r="16" fill="#D9730D"/><text x="636" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="695" y="300" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">ReMind answers</text><text x="695" y="324" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">kindly, in plain</text><text x="695" y="348" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">words</text><rect x="805" y="130" width="170" height="255" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="831" cy="156" r="16" fill="#D9730D"/><text x="831" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="890" y="300" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">A short note goes</text><text x="890" y="324" font-size="17" font-weight="400" fill="#2B2723" text-anchor="middle">to the caregiver</text><rect x="40" y="235" width="50" height="14" rx="4" fill="none" stroke="#8C857B" stroke-width="3" stroke-dasharray="6 4"/><polyline points="65,235 90,191 130,205" fill="none" stroke="#8C857B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M130,205 l12,6 M130,205 l6,14" fill="none" stroke="#8C857B" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="191" r="6" fill="#fff" stroke="#8C857B" stroke-width="3"/><circle cx="89.7" cy="250.3" r="4.05" fill="none" stroke="#8C857B" stroke-width="1.35"/><rect x="81.15" y="253.9" width="17.1" height="17.1" rx="3.6" fill="#FFFFFF" stroke="#2B2723" stroke-width="1.125"/><circle cx="114" cy="250.3" r="4.05" fill="none" stroke="#8C857B" stroke-width="1.35"/><rect x="105.45" y="253.9" width="17.1" height="17.1" rx="3.6" fill="#7C4DFF" stroke="#2B2723" stroke-width="1.125"/><circle cx="138.3" cy="250.3" r="4.05" fill="none" stroke="#8C857B" stroke-width="1.35"/><rect x="129.75" y="253.9" width="17.1" height="17.1" rx="3.6" fill="#2B2723" stroke="#2B2723" stroke-width="1.125"/><circle cx="271.52" cy="198.88" r="5.58" fill="none" stroke="#8C857B" stroke-width="1.8599999999999999"/><rect x="259.74" y="203.84" width="23.56" height="23.56" rx="4.96" fill="#2B2723" stroke="#2B2723" stroke-width="1.55"/><circle cx="305" cy="198.88" r="5.58" fill="none" stroke="#8C857B" stroke-width="1.8599999999999999"/><rect x="293.22" y="203.84" width="23.56" height="23.56" rx="4.96" fill="#FFFFFF" stroke="#2B2723" stroke-width="1.55"/><circle cx="338.48" cy="198.88" r="5.58" fill="none" stroke="#8C857B" stroke-width="1.8599999999999999"/><rect x="326.70000000000005" y="203.84" width="23.56" height="23.56" rx="4.96" fill="#7C4DFF" stroke="#2B2723" stroke-width="1.55"/><path d="M275,262 q30,16 60,0" fill="none" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><rect x="462" y="188" width="76" height="48" rx="9" fill="none" stroke="#8C857B" stroke-width="3"/><rect x="486" y="180" width="28" height="10" rx="3" fill="none" stroke="#8C857B" stroke-width="3"/><circle cx="500" cy="212" r="14" fill="none" stroke="#8C857B" stroke-width="3"/><circle cx="500" cy="212" r="5" fill="#8C857B"/><rect x="624" y="180" width="142" height="76" rx="16" fill="#FFF4E6" stroke="#E8B77A" stroke-width="2"/><polygon points="646,254 636,272 668,254" fill="#FFF4E6" stroke="#E8B77A" stroke-width="2"/><line x1="647" y1="256" x2="667" y2="256" stroke="#FFF4E6" stroke-width="4"/><text x="695" y="205" font-size="15" font-weight="400" fill="#2B2723" text-anchor="middle">“Almost! Try</text><text x="695" y="224" font-size="15" font-weight="400" fill="#2B2723" text-anchor="middle">swapping the</text><text x="695" y="243" font-size="15" font-weight="400" fill="#2B2723" text-anchor="middle">last two.”</text><rect x="860" y="178" width="60" height="72" rx="7" fill="#fff" stroke="#4F7F75" stroke-width="3"/><line x1="872" y1="196" x2="908" y2="196" stroke="#4F7F75" stroke-width="3" stroke-linecap="round"/><line x1="872" y1="210" x2="908" y2="210" stroke="#4F7F75" stroke-width="3" stroke-linecap="round"/><line x1="872" y1="224" x2="908" y2="224" stroke="#4F7F75" stroke-width="3" stroke-linecap="round"/><line x1="872" y1="238" x2="894" y2="238" stroke="#4F7F75" stroke-width="3" stroke-linecap="round"/><line x1="197" y1="258" x2="218" y2="258" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><line x1="392" y1="258" x2="413" y2="258" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><line x1="587" y1="258" x2="608" y2="258" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><line x1="782" y1="258" x2="803" y2="258" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><path d="M695,388 L695,438 L305,438 L305,390" fill="none" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><text x="500" y="474" font-size="18" font-weight="600" fill="#D9730D" text-anchor="middle">Not quite? Try again, up to 3 tries. Then ReMind gently shows the answer.</text><text x="500" y="502" font-size="17" font-weight="400" fill="#6B645B" text-anchor="middle">No score, no timer, no pressure.</text><text x="500" y="536" font-size="15" font-weight="400" fill="#8C857B" text-anchor="middle" font-style="italic">The dashed box is the arm shuffle, which is still being connected to the app.</text>
</svg>
