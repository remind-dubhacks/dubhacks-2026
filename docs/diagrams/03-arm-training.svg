<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How we taught the robot arm</title><desc id="d">A person moves a leader arm while a second arm copies. Two cameras record each try. Cloud software learns from the recordings. The team then tests it on the real table and records more examples wherever it fails.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B645B"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9730D"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D4AFF"/></marker>
</defs>
<rect width="1000" height="630" fill="#FBF9F5"/>
<text x="30" y="52" font-size="30" font-weight="700" fill="#2B2723">How we taught the arm</text><text x="30" y="82" font-size="18" fill="#6B645B">It learns by watching, the way you'd teach someone a card trick: show it, record it, practice, then test.</text><rect x="32" y="120" width="215" height="285" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="60" cy="148" r="16" fill="#D9730D"/><text x="60" y="154" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="272" y="120" width="215" height="285" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="300" cy="148" r="16" fill="#D9730D"/><text x="300" y="154" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="512" y="120" width="215" height="285" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="540" cy="148" r="16" fill="#D9730D"/><text x="540" y="154" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="752" y="120" width="215" height="285" rx="18" fill="#fff" stroke="#D8D0C4" stroke-width="2"/><circle cx="780" cy="148" r="16" fill="#D9730D"/><text x="780" y="154" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="41" y="237" width="50" height="14" rx="4" fill="none" stroke="#8C857B" stroke-width="3"/><polyline points="66,237 91,193 131,207" fill="none" stroke="#8C857B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M131,207 l12,6 M131,207 l6,14" fill="none" stroke="#8C857B" stroke-width="5" stroke-linecap="round"/><circle cx="91" cy="193" r="6" fill="#fff" stroke="#8C857B" stroke-width="3"/><rect x="131" y="237" width="50" height="14" rx="4" fill="none" stroke="#8C857B" stroke-width="3"/><polyline points="156,237 181,193 221,207" fill="none" stroke="#8C857B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M221,207 l12,6 M221,207 l6,14" fill="none" stroke="#8C857B" stroke-width="5" stroke-linecap="round"/><circle cx="181" cy="193" r="6" fill="#fff" stroke="#8C857B" stroke-width="3"/><line x1="117" y1="266" x2="161" y2="266" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><text x="101" y="288" font-size="13" font-weight="600" fill="#8C857B" text-anchor="middle">leader</text><text x="191" y="288" font-size="13" font-weight="600" fill="#8C857B" text-anchor="middle">follower</text><rect x="331" y="189" width="96" height="52" rx="6" fill="#fff" stroke="#8C857B" stroke-width="3"/><rect x="339" y="197" width="14" height="10" rx="2" fill="#8C857B"/><rect x="339" y="223" width="14" height="10" rx="2" fill="#8C857B"/><rect x="361" y="197" width="14" height="10" rx="2" fill="#8C857B"/><rect x="361" y="223" width="14" height="10" rx="2" fill="#8C857B"/><rect x="383" y="197" width="14" height="10" rx="2" fill="#8C857B"/><rect x="383" y="223" width="14" height="10" rx="2" fill="#8C857B"/><rect x="405" y="197" width="14" height="10" rx="2" fill="#8C857B"/><rect x="405" y="223" width="14" height="10" rx="2" fill="#8C857B"/><text x="379" y="262" font-size="14" font-weight="600" fill="#D9730D" text-anchor="middle">35 s per try</text><circle cx="619" cy="215" r="22" fill="none" stroke="#8C857B" stroke-width="6"/><circle cx="619" cy="215" r="7" fill="#8C857B"/><line x1="643.0" y1="215.0" x2="653.0" y2="215.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="636.0" y1="232.0" x2="643.0" y2="239.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="619.0" y1="239.0" x2="619.0" y2="249.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="602.0" y1="232.0" x2="595.0" y2="239.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="595.0" y1="215.0" x2="585.0" y2="215.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="602.0" y1="198.0" x2="595.0" y2="191.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="619.0" y1="191.0" x2="619.0" y2="181.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><line x1="636.0" y1="198.0" x2="643.0" y2="191.0" stroke="#8C857B" stroke-width="9" stroke-linecap="round"/><rect x="825" y="179" width="68" height="76" rx="8" fill="#fff" stroke="#4F7F75" stroke-width="3"/><path d="M837,197 l5,6 l10,-12" fill="none" stroke="#4F7F75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="855" y1="197" x2="881" y2="197" stroke="#4F7F75" stroke-width="3.5" stroke-linecap="round"/><path d="M837,219 l5,6 l10,-12" fill="none" stroke="#4F7F75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="855" y1="219" x2="881" y2="219" stroke="#4F7F75" stroke-width="3.5" stroke-linecap="round"/><path d="M837,241 l5,6 l10,-12" fill="none" stroke="#4F7F75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="855" y1="241" x2="881" y2="241" stroke="#4F7F75" stroke-width="3.5" stroke-linecap="round"/><text x="139" y="306" font-size="20" font-weight="700" fill="#2B2723" text-anchor="middle">Show it</text><text x="139" y="332" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">A person moves a</text><text x="139" y="352" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">“leader” arm. A second</text><text x="139" y="372" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">arm copies every move,</text><text x="139" y="392" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">slowly and gently.</text><text x="379" y="306" font-size="20" font-weight="700" fill="#2B2723" text-anchor="middle">Record it</text><text x="379" y="332" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">Two cameras film each</text><text x="379" y="352" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">try: 5 kinds of shuffle,</text><text x="379" y="372" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">12 tries each. A voice</text><text x="379" y="392" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">coaches the operator.</text><text x="619" y="306" font-size="20" font-weight="700" fill="#2B2723" text-anchor="middle">Let it learn</text><text x="619" y="332" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">Cloud software studies</text><text x="619" y="352" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">the recordings and</text><text x="619" y="372" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">learns to copy the</text><text x="619" y="392" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">motion.</text><text x="859" y="306" font-size="20" font-weight="700" fill="#2B2723" text-anchor="middle">Test it for real</text><text x="859" y="332" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">Run it again and again</text><text x="859" y="352" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">on the real table and</text><text x="859" y="372" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">count how often it</text><text x="859" y="392" font-size="15" font-weight="400" fill="#6B645B" text-anchor="middle">works.</text><line x1="249" y1="262" x2="270" y2="262" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><line x1="489" y1="262" x2="510" y2="262" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><line x1="729" y1="262" x2="750" y2="262" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><path d="M859,408 L859,446 L379,446 L379,410" fill="none" stroke="#D9730D" stroke-width="3" marker-end="url(#ao)"/><text x="500" y="480" font-size="18" font-weight="600" fill="#D9730D" text-anchor="middle">It fails in one spot? Record more of exactly that case, then retrain.</text><rect x="20" y="505" width="960" height="100" rx="18" fill="#FFF4E6" stroke="#E8B77A" stroke-width="2"/><text x="40" y="536" font-size="17" font-weight="700" fill="#D9730D" text-anchor="start">Why so careful?</text><text x="40" y="562" font-size="15" font-weight="400" fill="#2B2723" text-anchor="start">Same table, same lights, same camera angle every time: the robot is picky about its surroundings.</text><text x="40" y="584" font-size="15" font-weight="400" fill="#2B2723" text-anchor="start">Slow, gentle moves and soft, light objects only, because it copies how we move and works near older adults.</text>
</svg>
