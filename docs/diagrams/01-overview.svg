<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ReMind in one picture</title><desc id="d">A resident talks and plays with ReMind: a voice companion, a calm screen, and a robot arm with a camera. The caregiver sets up each session, gets a summary, and gets a text alert if something seems wrong.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B645B"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9730D"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D4AFF"/></marker>
</defs>
<rect width="1000" height="560" fill="#FBF9F5"/>
<text x="30" y="52" font-size="30" font-weight="700" fill="#2B2723">ReMind in one picture</text><text x="30" y="82" font-size="18" fill="#6B645B">A talking companion plus a robot arm, with a caregiver always in the loop.</text><rect x="20" y="150" width="200" height="270" rx="18" fill="#FFF8EC" stroke="#E0C79A" stroke-width="2"/><circle cx="120" cy="199" r="17" fill="#C9A26B"/><path d="M90,259 Q90,221 120,221 Q150,221 150,259 Z" fill="#C9A26B"/><text x="120" y="303" font-size="22" font-weight="700" fill="#2B2723" text-anchor="middle">Resident</text><text x="120" y="331" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle">Someone living with</text><text x="120" y="352" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle">memory loss</text><rect x="312" y="100" width="376" height="400" rx="18" fill="#EFF3FA" stroke="#A9BBD9" stroke-width="3"/><text x="500" y="138" font-size="24" font-weight="700" fill="#2B2723" text-anchor="middle">ReMind</text><rect x="334" y="160" width="50" height="36" rx="16" fill="#fff" stroke="#A9BBD9" stroke-width="2"/><polygon points="356,194 346,212 378,194" fill="#fff" stroke="#A9BBD9" stroke-width="2"/><line x1="357" y1="196" x2="377" y2="196" stroke="#fff" stroke-width="4"/><text x="402" y="174" font-size="16" font-weight="400" fill="#2B2723" text-anchor="start">Talks and listens in real time,</text><text x="402" y="195" font-size="16" font-weight="400" fill="#2B2723" text-anchor="start">in short, kind sentences</text><rect x="334" y="232" width="52" height="42" rx="5" fill="#fff" stroke="#A9BBD9" stroke-width="3"/><circle cx="352" cy="246" r="5" fill="#E0A030"/><path d="M334,274 L354,252 L368,266 L378,258 L386,274 Z" fill="#9CC3BA"/><text x="402" y="247" font-size="16" font-weight="400" fill="#2B2723" text-anchor="start">Shows one photo or a few words</text><text x="402" y="268" font-size="16" font-weight="400" fill="#2B2723" text-anchor="start">on a calm screen</text><rect x="326" y="296" width="348" height="122" rx="14" fill="#FFF4E6" stroke="#D9730D" stroke-width="3"/><rect x="332" y="368" width="50" height="14" rx="4" fill="none" stroke="#8C857B" stroke-width="3"/><polyline points="357,368 382,324 422,338" fill="none" stroke="#8C857B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M422,338 l12,6 M422,338 l6,14" fill="none" stroke="#8C857B" stroke-width="5" stroke-linecap="round"/><circle cx="382" cy="324" r="6" fill="#fff" stroke="#8C857B" stroke-width="3"/><circle cx="368.72" cy="390.68" r="2.88" fill="none" stroke="#8C857B" stroke-width="0.96"/><rect x="362.64000000000004" y="393.24" width="12.16" height="12.16" rx="2.56" fill="#2B2723" stroke="#2B2723" stroke-width="0.8"/><circle cx="386" cy="390.68" r="2.88" fill="none" stroke="#8C857B" stroke-width="0.96"/><rect x="379.92" y="393.24" width="12.16" height="12.16" rx="2.56" fill="#FFFFFF" stroke="#2B2723" stroke-width="0.8"/><circle cx="403.28" cy="390.68" r="2.88" fill="none" stroke="#8C857B" stroke-width="0.96"/><rect x="397.2" y="393.24" width="12.16" height="12.16" rx="2.56" fill="#7C4DFF" stroke="#2B2723" stroke-width="0.8"/><text x="456" y="328" font-size="16" font-weight="700" fill="#2B2723" text-anchor="start">The star: a robot arm</text><text x="456" y="350" font-size="16" font-weight="700" fill="#2B2723" text-anchor="start">mixes up real objects;</text><text x="456" y="372" font-size="16" font-weight="700" fill="#2B2723" text-anchor="start">a camera watches</text><text x="456" y="394" font-size="16" font-weight="700" fill="#2B2723" text-anchor="start">the table</text><path d="M348,434.0 L368.0,442.0 L368.0,460.0 Q368.0,476.0 348,484.0 Q328.0,476.0 328.0,460.0 L328.0,442.0 Z" fill="#9CC3BA"/><path d="M339.0,459.0 l7,7 l13,-15" fill="none" stroke="#fff" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/><text x="402" y="452" font-size="16" font-weight="400" fill="#2B2723" text-anchor="start">Safe by design: the AI can only</text><text x="402" y="473" font-size="16" font-weight="400" fill="#2B2723" text-anchor="start">ask, and rules decide</text><line x1="222" y1="285" x2="310" y2="285" stroke="#6B645B" stroke-width="3" marker-start="url(#ag)" marker-end="url(#ag)"/><text x="266" y="252" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle">talk and</text><text x="266" y="271" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle">play</text><line x1="690" y1="235" x2="778" y2="235" stroke="#4F7F75" stroke-width="3" marker-end="url(#ag)"/><text x="734" y="195" font-size="15" font-weight="400" fill="#4F7F75" text-anchor="middle">session</text><text x="734" y="214" font-size="15" font-weight="400" fill="#4F7F75" text-anchor="middle">summary</text><line x1="690" y1="345" x2="778" y2="345" stroke="#6D4AFF" stroke-width="3" marker-end="url(#ap)"/><text x="734" y="375" font-size="15" font-weight="400" fill="#6D4AFF" text-anchor="middle">text alert</text><text x="734" y="394" font-size="15" font-weight="400" fill="#6D4AFF" text-anchor="middle">if worried</text><rect x="780" y="150" width="200" height="270" rx="18" fill="#FFF8EC" stroke="#E0C79A" stroke-width="2"/><circle cx="880" cy="199" r="17" fill="#B88B55"/><path d="M850,259 Q850,221 880,221 Q910,221 910,259 Z" fill="#B88B55"/><text x="880" y="303" font-size="22" font-weight="700" fill="#2B2723" text-anchor="middle">Caregiver</text><text x="880" y="331" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle">Sets up each session</text><text x="880" y="352" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle">and stays in charge</text><text x="500" y="534" font-size="16" font-weight="400" fill="#6B645B" text-anchor="middle" font-style="italic">ReMind supports engagement. It is not a medical or diagnostic tool.</text>
</svg>
